name: Smoke

# After a push to main, Vercel deploys production. This waits until the production URL serves
# that exact commit (/api/health returns its SHA), then runs the read-only smoke tests against
# it. A failure means production is broken: roll back with Instant Rollback in Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_URL: https://training-log-taupe.vercel.app

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que producción sirva este commit
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS "$PRODUCTION_URL/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            if [ "$v" = "$GITHUB_SHA" ]; then echo "Desplegado $v"; exit 0; fi
            echo "Producción en '${v:-?}', esperando $GITHUB_SHA…"; sleep 15
          done
          echo "Producción no llegó a este commit en 15 min (¿falló el CI o el build?)"; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: ${{ env.PRODUCTION_URL }}
